workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest
  FF_USE_FASTZIP: true
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  KONAN_DATA_DIR: $CI_PROJECT_DIR/.konan

stages:
  - binaries
  - check
  - publish

binaries:
  stage: binaries
  tags: [ connect2x-mac ]
  artifacts:
    paths:
      - libsqlitenity/archive
      - libsqlitenity/lib
  script: cd libsqlitenity && ./ci.nu

check:
  stage: check
  tags: [ connect2x-mac ]
  cache:
    - paths: [ $GRADLE_USER_HOME ]
  artifacts:
    paths: [ "**/build/reports" ]
    reports:
      junit: "**/build/test-results/**/TEST-*.xml"
    when: always
  script: ./gradlew --stacktrace check

publish:
  stage: publish
  tags: [ connect2x-mac ]
  cache:
    - paths: [ $GRADLE_USER_HOME ]
  script: ./gradlew --stacktrace publishAllPublicationsToGitLabRepository