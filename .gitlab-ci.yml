workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest
  FF_USE_FASTZIP: true
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  KONAN_DATA_DIR: $CI_PROJECT_DIR/.konan

stages:
  - binaries
  - check
  - docs
  - publish

.if-merge-request: &if-merge-request
  - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME

.if-release: &if-release
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*/'

.if-dev-release: &if-dev-release
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*/'
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: '$CI_COMMIT_BRANCH =~ /^v-\d+\.\d+\.\d+.*/'

binaries:
  stage: binaries
  tags: [ connect2x-mac ]
  rules:
    - *if-merge-request
    - *if-release
    - *if-dev-release
  artifacts:
    paths:
      - libsqlitenity/archive
      - libsqlitenity/lib
  script: cd libsqlitenity && ./ci.nu

check:
  stage: check
  tags: [ connect2x-mac ]
  rules:
    - *if-merge-request
  cache:
    - paths: [ $GRADLE_USER_HOME ]
  artifacts:
    paths: [ "**/build/reports" ]
    reports:
      junit: "**/build/test-results/**/TEST-*.xml"
    when: always
  script: ./gradlew --stacktrace check

docs:
  stage: docs
  tags: [ connect2x-mac ]
  rules:
    - *if-release
    - *if-dev-release
  artifacts:
    name: docs
    when: always
    paths: [ build/dokka/html ]
    expire_in: 7d
  environment:
    name: docs/${CI_PIPELINE_IID}
    url: https://connect2x.gitlab.io/-/sqlitenity/-/jobs/${CI_JOB_ID}/artifacts/build/dokka/html/index.html
  script: ./gradlew --stacktrace dokkaGenerate

publish:
  stage: publish
  tags: [ connect2x-mac ]
  rules:
    - *if-release
    - *if-dev-release
  timeout: 2h
  cache:
    - paths: [ $GRADLE_USER_HOME ]
  script: ./gradlew --stacktrace publish
